<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>進捗ボード</title>
<script>
  // 進捗ボード本体（GASウェブアプリ）へ即転送する。画面には何も表示しない
  const APP_URL = 'https://script.google.com/macros/s/AKfycbx24g4CNcjkDAsLvIRC3JkLtyrEoGK_3-n_B5vHYaImTmDmY_6t1hvV93SURaL1Gi6U3w/exec';
  const p = new URLSearchParams(location.search).get('p') || '';
  location.replace(APP_URL + (/^P\d{3,}$/.test(p) ? ('?p=' + p) : ''));
</script>
</head>
<body></body>
</html>
